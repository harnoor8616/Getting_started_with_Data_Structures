name: Fix README Formatting

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-readme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add blank line after LeetCode Topics heading
        run: |
          python3 << 'EOF'
          from pathlib import Path

          readme = Path("README.md")

          if readme.exists():
              text = readme.read_text()

              old = "# LeetCode Topics\n##"
              new = "# LeetCode Topics\n\n##"

              if old in text:
                  text = text.replace(old, new, 1)
                  readme.write_text(text)
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git diff --quiet || (
            git add README.md
            git commit -m "Auto-format README"
            git push
          )
